# =============================================================================
# Default Configuration for 6-hour Accumulation Forecasts
#
# Defines the default model, predictor fields, data paths, and output location
# used to generate cGAN forecasts for 6-hour precipitation accumulations.
#
# MODEL  - trained model location, checkpoint, and accumulation period
# DATA   - spatial domain and IFS forecast predictor fields
# INPUT  - input forecast, truth, constants, and normalisation data paths
# OUTPUT - location for generated cGAN forecasts
#
# =============================================================================

MODEL:
    folder: "../../models/ifs+cgan_imerg_6h"
    checkpoint: 26880
    accumulation: 6

DATA:
    crop_to_bounds: True
    bounds: [-35.06, 15.94, 3.26, 51.06] #bounds: [lat_min, lon_min, lat_max, lon_max]
    all_fcst_fields:
        - mucape
        - cp
        - tcc
        - sp
        - ssr
        - t2m
        - tciw
        - tclw
        - tcw
        - tcwv
        - tp
        - u700
        - v700

    accumulated_fields:
        - cp
        - ssr
        - tp

    nonnegative_fields:
        - mucape
        - cp
        - tcc
        - sp
        - ssr
        - t2m
        - tciw
        - tclw
        - tcw
        - tcwv
        - tp

INPUT:
    truth_folder: '/to/edit/if/you/want/to/calculate/crps'
    fcst_folder: '../../data/IFS_forecast_data'
    constants_folder: '../../data/IFS_forecast_data/constants'
    normalisation_folder: '../../models/ifs+cgan_imerg_6h'

OUTPUT:
    folder: "../../data/ifs+cgan_imerg_6h/cGAN_forecasts"