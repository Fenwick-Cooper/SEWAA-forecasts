CONSTANTS:
  constants_list:
  - elev
  - lsm
  - distance_from_radar_instrument
  - azimuthal_sin
  - azimuthal_cos
DATA:
  accumulated_fields:
  - cp
  - ssr
  - tp
  accumulation: 24
  all_fcst_fields:
  - mcc
  - sp
  - tcwv
  - tp
  bounds:
  - -35.06
  - 15.94
  - 3.26
  - 51.06
  crop_to_bounds: false
  leadtime:
  - 30
  - 54
  nonnegative_fields:
  - mucape
  - cp
  - tcc
  - sp
  - ssr
  - t2m
  - tciw
  - tclw
  - tcw
  - tcwv
  - tp
DISCRIMINATOR:
  filters_disc: 32
  learning_rate_disc: 1e-5
EVAL:
  add_postprocessing_noise: true
  avg_pooling: true
  max_pooling: true
  num_batches: 25
  postprocessing_noise_factor: 1e-3
GENERAL:
  local_config_path: local_config_rwanda.yaml
  mode: GAN
  problem_type: normal
GENERATOR:
  filters_gen: 16
  latent_variables: 50
  learning_rate_gen: 1e-5
  noise_channels: 4
MODEL:
  architecture: forceconv
  include_cape: false
  padding: reflect
SETUP:
  log_folder: /network/group/aopp/predict/AWH029_WRIGHT_S2SPREC/rwanda_radar_data/new_radar_sample/cgan_training/logs
TRAIN:
  CL_type: ensmeanMSE
  batch_size: 2
  content_loss_weight: 1000.0
  ensemble_size: 8
  kl_weight: 1e-8
  num_samples: 256
  steps_per_checkpoint: 8
  train_years:
  - 2026
  training_weights:
  - 0.4
  - 0.3
  - 0.2
  - 0.1
VAL:
  val_size: 8
  val_years: 2026
